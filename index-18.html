async function chInfo(){

  const r = await sb.rpc("get_chapter_list",{p_book_id:book.id});

  return totals[book.id];
}

const COVERS = {wishful:"cover-wishful.jpg", bread:"cover-bread.jpg", thirsty:"cover-thirsty.jpg", teacher:"cover-teacher.jpg", regrets:"cover-secret.jpg"};
const GENRES = {wishful:"Fiction", thirsty:"Fiction", regrets:"Fiction", bread:"Personal finance \u00b7 Financial discipline", teacher:"Inspirational \u00b7 Non-fiction \u00b7 Mentorship", leading:"Leadership \u00b7 Non-fiction"};

  thirsty:"One hello. One misunderstanding. One love worth fighting for. A heartfelt Kenyan love story full of laughter, secrets, and second chances.",
  regrets:"He trusted the wrong man, and it cost him everything he loved. A gripping Kenyan novel about ambition, betrayal, and the lies we tell ourselves.",
  bread:"He earned money, but never kept it. Eleven honest stories about money, mistakes, and the discipline that changed everything.",

  {title:"In My Stupid Era", genre:"Memoir \u00b7 Coming soon", blurb:"Red flags I called friendship. Warnings I called patience. A memoir about the things we do when we know better."},

const comingCard = c => `<div class="card bk"><div><span class="gn">${esc(c.genre)}</span><h2>${esc(c.title)}</h2><p>${esc(c.blurb)}</p><p class="sub">Want to know when it\u2019s out?</p><div class="btns"><a class="btn alt" href="https://wa.me/${WA}?text=${encodeURIComponent("Hello Nick, please let me know when "+c.title+" is out.")}" target="_blank" rel="noopener">Message me on WhatsApp</a></div></div></div>`;
const genreOf = b => { const t = ((b && b.title) || "").toLowerCase(); for(const k in GENRES) if(t.includes(k)) return GENRES[k]; return "" };
const trustHtml = () => `<div class="card" id="how"><h2>How it works</h2><ol class="steps"><li>Read the free sample chapters of any book.</li><li>Create an account and pay securely through Paystack.</li><li>Your book unlocks automatically after payment. Log in any time to find it in My Library and read it online on your phone.</li></ol></div>
<div class="card" id="help"><h2>Questions</h2>
<details><summary>I paid. Where is my book?</summary><p>Log out and log in again, then look under My Library. If it still isn't there, message me on WhatsApp with your payment reference.</p></details>
<details><summary>I forgot my password</summary><p>Tap Log in / Sign up, then use the forgot password link and follow the email.</p></details>
<details><summary>Can I read on a new phone?</summary><p>Yes. Log in on the new phone and follow the prompt to move your account to it. If that doesn't work, message me on WhatsApp.</p></details>
<details><summary>Can I download the book?</summary><p>No. Books are read online on this site.</p></details>
<details><summary>How do I read my book after paying?</summary><p>Your book unlocks as soon as your payment is confirmed. Log in, open My Library, and tap Start reading. If you see a message that your payment is still processing, wait a few minutes before trying again and do not pay twice.</p></details>
<details><summary>What is your refund policy?</summary><p>Books are digital and unlock as soon as you pay, so purchases are generally final. If you were charged twice, paid but cannot open your book, or something else went wrong, message me on WhatsApp with your payment reference within 7 days and I will fix it or refund you.</p></details>
<p>Still stuck? <a class="link" href="https://wa.me/${WA}" target="_blank" rel="noopener">WhatsApp me</a> or email <a class="link" href="mailto:nickkoechbooks@gmail.com">nickkoechbooks@gmail.com</a>.</p></div>`;
const coverOf = b => { const t = ((b && b.title) || "").toLowerCase(); for(const k in COVERS) if(t.includes(k)) return COVERS[k]; return "" };

function did(){
  try{let d=localStorage.getItem("did");if(!d){d=crypto.randomUUID();localStorage.setItem("did",d)}return d}
  catch(e){return "no-storage"}
}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = t => t.split(/\n{2,}/).map(p => "<p>"+esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/\n/g,"<br>")+"</p>").join("");
const isKenya = () => { try{return Intl.DateTimeFormat().resolvedOptions().timeZone==="Africa/Nairobi"}catch(e){return false} };
const isNet = e => !navigator.onLine || /failed to fetch|networkerror|network request|load failed|fetch failed/i.test((e && e.message) || "");
const LOADING = t => '<p class="wait"><span class="spin"></span>' + (t || "Loading…") + '</p>';
function retryView(fn, backFn){
  app.innerHTML = '<div class="card"><h2>Connection problem</h2><p>We could not reach the server. Check your internet connection or mobile data, then try again.</p><button id="rt">Try again</button>' + (backFn ? '<button class="alt" id="rb">Go back</button>' : '') + '</div>';

window.addEventListener("online", syncOnline); window.addEventListener("offline", syncOnline); syncOnline();
function clearPay(){ try{ localStorage.removeItem("pay_ref") }catch(e){} }
async function confirmPayment(ref, bookId){
  let body = null, netFail = false;
  for(let i = 0; i < 3; i++){
    netFail = false; body = null;
    try{
      const {data, error} = await sb.functions.invoke("dynamic-service", {body:{reference:ref, book_id:bookId}});
      if(!error) body = data || {};
      else {
        try{ body = (error.context && error.context.json) ? await error.context.json() : null }catch(e){ body = null }
        if(!body) netFail = true;
      }
    }catch(e){ netFail = true }
    if(!netFail) break;
    await new Promise(r => setTimeout(r, 1500));
  }
  if(netFail) return {state:"error", net:true};
  if(body && body.ok) return {state:"ok"};
  const err = body && body.error, st = (body && body.status) || "";
  if(err === "payment_not_successful") return {state: (st === "failed" || st === "abandoned") ? "failed" : "pending"};
  return {state:"error", why:err};
}
function payMsg(r, ref){
  const refTxt = " Your payment reference is " + ref + ".";
  if(r.state === "ok") return "Payment confirmed. Enjoy the book!";
  if(r.state === "pending") return "Your payment is still being processed. Please do not pay again. Wait a few minutes, then log in again and check My Library." + refTxt;
  if(r.state === "failed") return "The payment did not go through. You can try again. If money left your account, message me on WhatsApp." + refTxt;
  if(r.why === "not_logged_in") return "Your session expired before we could confirm your payment. Please log in again and your book will unlock." + refTxt;
  return "We could not confirm your payment yet. If you were charged, do not pay again. Reopen this site while online and your book will unlock automatically, or message me on WhatsApp." + refTxt;
}
async function retryPending(){
  let p = null; try{ p = JSON.parse(localStorage.getItem("pay_ref") || "null") }catch(e){}
  if(!p || !user) return;
  const r = await confirmPayment(p.ref, p.book);
  if(r.state === "ok"){ clearPay(); await refreshOwned(); note = "Your payment was confirmed and your book is unlocked. Enjoy!" }
  else if(r.state === "failed" || r.why === "payment_mismatch" || r.why === "book_not_found") clearPay();
}
let paying = false;
function human(e){
  const m = (e && e.message) || "";
  if(isNet(e)) return "You seem to be offline or the connection is slow. Check your connection and try again.";
  if(/jwt|token.*expired|session/i.test(m)) return "Your session expired. Please log in again.";
  if(m.includes("device_mismatch")) return "This account is linked to another phone. Log in on that phone, or contact the author to reset.";
  if(m.includes("not_purchased")) return "You haven't bought this book yet.";
  if(m.includes("not_logged_in")) return "Log in to keep reading.";
  if(m.includes("chapter_not_found")) return "That's the last chapter available.";
  return m || "Something went wrong. Try again.";
}

  const label = isKenya() ? "KES "+kes : "KES "+kes+" (about USD "+Number(b.price_usd).toFixed(2)+")";
  return {kes,label};
}

  const bookCard = b => { const own = ownedSet.has(b.id); return `<div class="card bk">${coverOf(b)?'<img src="'+coverOf(b)+'" alt="Cover of '+esc(b.title)+'">':''}<div><span class="gn">${esc(genreOf(b))}</span><h2>${esc(b.title)}</h2><p class="desc">${esc(shortOf(b))}</p><p class="price">${own ? "You own this book" : priceInfo(b).label}</p>${own?'':'<p class="sub">Free sample available</p>'}<div class="btns"><button data-id="${b.id}">${own?"Open":"Details &amp; buy"}</button>${own?'':'<button class="alt" data-sample="'+b.id+'">Read free sample</button>'}</div></div></div>` };
  const FEATURED_KEY = "regrets";
  const featBook = allBooks.length >= 3 ? ((FEATURED_KEY && allBooks.find(b => (b.title||"").toLowerCase().includes(FEATURED_KEY))) || allBooks.find(b => !ownedSet.has(b.id)) || allBooks[0]) : null;

  app.innerHTML = `<div class="wide" hidden></div><nav class="nav2"><div class="brow"><b>Nick Koech Books</b>${user?'':'<button id="navauth">Log in / Sign up</button>'}</div><span><a href="#" data-go="books">Books</a><a href="#" data-go="how">How it works</a><a href="#" data-go="about">About</a><a href="#" data-go="help">Help</a>${user&&ownedSet.size?'<a href="#" id="refl">Refer &amp; earn</a>':''}</span></nav>
    ${user?'<div class="acct">'+esc(user.email)+' · <a href="#" id="out">Log out</a></div>':''}
    <div class="hero"><img src="author.jpg" alt="Nick Koech"><div><h1>Nick Koech</h1><p class="by">More Than Stories. Experiences That Stay With You.</p></div></div><p>Fiction that keeps you turning pages and nonfiction that gives you something to act on, from Kenyan author and mentor Nick Koech. Read the first chapters of any book free.</p><div id="books"></div>${mineHtml}${mine.length?'':'<h2>Books</h2>'}${featHtml}${cards}
    ${trustHtml()}
    ${refCard()}
    ${user?'':'<div class="card"><b>Have an account?</b><p>Log in or sign up to buy books and keep reading on your phone.</p><button id="goauth">Log in / Sign up</button></div>'}
    ${mismatchHtml()}
    <p class="msg" id="msg">${esc(note)}</p>${footerHtml()}`;
  note = "";
  const $ = id => document.getElementById(id);
  if($("fp")) $("fp").onclick = e => { e.preventDefault(); forgot() };
  if($("sw")) $("sw").onclick = switchDevice;
  if($("goauth")) $("goauth").onclick = () => authView("in");

  if($("navauth")) $("navauth").onclick = () => authView("in");
  if($("refl")) $("refl").onclick = e => { e.preventDefault(); referView() };
  document.querySelectorAll("a[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.dataset.go); if(t) t.scrollIntoView({behavior:"smooth"}) });
  document.querySelectorAll("button[data-sample]").forEach(btn => btn.onclick = async () => {
    book = allBooks.find(x => x.id === btn.dataset.sample); owned = ownedSet.has(book.id);
    const I = await chInfo(); reader(I.first);
  });
  document.querySelectorAll("button[data-id]").forEach(btn => btn.onclick = () => {
    book = allBooks.find(x => x.id === btn.dataset.id); owned = ownedSet.has(book.id); home();
  });
  if($("out")) $("out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); user=null; owned=false; ownedSet=new Set(); library() };
  document.querySelectorAll("button[data-read]").forEach(btn => btn.onclick = () => { book = allBooks.find(x => x.id === btn.dataset.read); owned = true; let l = 1; try{ l = Number(localStorage.getItem("last_"+book.id)) || 1 }catch(e){} reader(l) });
  if($("in")) $("in").onclick = async () => {
    const {data,error} = await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(error){ $("msg").textContent = error.message; return }
    user = data.user; await registerDevice(); await refreshOwned(); library();
  };
  if($("up")) $("up").onclick = async () => {
    const {data,error} = await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
    if(error){ $("msg").textContent = error.message; return }
    if(data.session){ user = data.user; await registerDevice(); await refreshOwned(); library() }
    else $("msg").textContent = "Check your email to confirm your account, then log in.";
  };
}
function buy(){
  if(!PAYMENTS_OPEN || paying) return;
  if(!user){ note="Log in or sign up first, then tap Buy."; return authView("in") }
  if(owned){ note="You already own this book."; return home() }
  if(!navigator.onLine){ note="You are offline. Reconnect, then tap Buy again."; return home() }
  if(!window.PaystackPop){ note="Payment didn't load. Check your connection and try again."; return home() }
  paying = true;
  const bb = document.getElementById("buy"); if(bb){ bb.disabled = true; bb.textContent = "Opening payment…" }
  try{
    new PaystackPop().newTransaction({
      key:PK, email:user.email, amount:priceInfo().kes*100, currency:"KES",
      metadata:{user_id:user.id, book_id:book.id},
      onSuccess: async t => {
        app.innerHTML = '<div class="card wait"><span class="spin"></span>Confirming your payment… please do not close this page or pay again.</div>';
        try{ localStorage.setItem("pay_ref", JSON.stringify({ref:t.reference, book:book.id})) }catch(e){}
        const r = await confirmPayment(t.reference, book.id);
        if(r.state === "ok" || r.state === "failed") clearPay();
        if(r.state === "ok") await refreshOwned();
        note = payMsg(r, t.reference);
        paying = false; home();
      },
      onCancel: () => { paying = false; note = "Payment cancelled."; home() },
      onError: () => { paying = false; note = "Payment could not start. Check your connection and try again."; home() }
    });
  }catch(e){ paying = false; note = "Payment could not start. Please try again."; home() }
}

function authView(mode = "in"){
  const up = mode === "up";
  app.innerHTML = `<div class="top"><a href="#" id="bk">← Back</a><span></span></div>
    <h1>${up?"Create account":"Welcome back"}</h1>
    <p class="by">${up?"Sign up to buy books and read on your phone.":"Log in to continue reading."}</p>
    <div class="card">
      <label class="lb" for="em">Email</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
      <label class="lb" for="pw">Password</label><input id="pw" type="password" placeholder="6+ characters" autocomplete="${up?"new-password":"current-password"}">
      <button id="go">${up?"Sign up":"Log in"}</button>
      <p class="msg" id="msg">${esc(note)}</p>
      <p>${up?'Already have an account? <a href="#" id="sw2">Log in</a>':'New here? <a href="#" id="sw2">Create an account</a> · <a class="link" href="#" id="fp">Forgot password?</a>'}</p>
    </div>`;
  note = "";
  const $ = id => document.getElementById(id);
  const back = () => book ? home() : library();
  $("bk").onclick = e => { e.preventDefault(); back() };
  $("sw2").onclick = e => { e.preventDefault(); authView(up ? "in" : "up") };
  if($("fp")) $("fp").onclick = e => { e.preventDefault(); forgot() };
  $("go").onclick = async () => {
    const b = $("go"); if(b.disabled) return;
    const label = b.textContent; b.disabled = true; b.textContent = up ? "Creating account…" : "Logging in…";
    const creds = {email:$("em").value.trim(), password:$("pw").value};
    const {data,error} = up ? await sb.auth.signUp(creds) : await sb.auth.signInWithPassword(creds);
    if(error){
      $("msg").textContent = /Database error saving new user/i.test(error.message) ? "This email may already be registered. Check your email for the confirmation link, or log in." : error.message;
      b.disabled = false; b.textContent = label; return;
    }
    if(!data.session){ $("msg").textContent = "Account created. Check your email (and spam folder) for the confirmation link, then log in."; b.textContent = label; return }
    user = data.user; await registerDevice(); await refreshOwned(); back();
  };
}

  return `<div class="card" id="about"><h2>About Nick Koech</h2><div class="about"><img src="author.jpg" alt="Portrait of Nick Koech"><div><p class="role">AUTHOR \u00b7 MENTOR \u00b7 SPEAKER</p><p><b>Every Story Has Something to Leave With You.</b></p><p>I\u2019m Nick Koech, an author and mentor from Kenya. I write fiction, nonfiction, and screenplays, and one question sits behind all of it: what will the reader carry out of this story?</p></div></div>
    <p>Sometimes it\u2019s a twist you didn\u2019t see coming. Sometimes it\u2019s a lesson about money, ambition, or growing up that I wish someone had told me sooner. My stories draw on real life, from Nairobi streets to my roots in Kericho, and on what I\u2019ve learned mentoring and speaking with people along the way.</p>
    <p>Don\u2019t just read a book. Experience a story. Discover a lesson.</p>
    <p class="sub">Readers, mentorship and speaking enquiries are welcome.</p>
    <div class="btns"><a class="btn" href="https://wa.me/${WA}" target="_blank" rel="noopener">Message on WhatsApp</a><a class="btn alt" href="mailto:nickkoechbooks@gmail.com">Send an email</a></div>
    <p class="foot">Need help? <a href="${wa}" target="_blank" rel="noopener">Chat with me on WhatsApp</a> or email <a href="mailto:nickkoechbooks@gmail.com">nickkoechbooks@gmail.com</a></p><p class="foot"><a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms of use</a></p></div>`;
}
function mismatchHtml(){
  return mismatch ? '<div class="card"><b>New phone?</b><p>This account is linked to another phone. You can switch it to this phone (up to 2 times).</p><button id="sw">Use this phone</button></div>' : "";
}
async function switchDevice(){
  const {error} = await sb.rpc("switch_device",{p_device_id:did()});
  if(error) note = (error.message||"").includes("reset_limit") ? "You've used all your phone switches. Please contact the author on WhatsApp." : human(error);
  else { mismatch = false; note = "Done. This phone is now your reading phone." }
  book ? home() : library();
}
async function forgot(){
  const em = document.getElementById("em").value.trim(), m = document.getElementById("msg");
  if(!em){ m.textContent = "Type your email above first."; return }
  const {error} = await sb.auth.resetPasswordForEmail(em,{redirectTo:SITE});
  m.textContent = error ? error.message : "Check your email for a reset link.";
}
function resetView(){
  app.innerHTML = '<h1>New password</h1><div class="card"><label class="lb" for="np">New password</label><input id="np" type="password" placeholder="6+ characters" autocomplete="new-password"><button id="sv">Save password</button></div><p class="msg" id="msg"></p><p><a class="link" href="#" id="bk">Back to the site</a></p>';
  document.getElementById("bk").onclick = e => { e.preventDefault(); recovering = false; history.replaceState(null,"",SITE); start() };
  document.getElementById("sv").onclick = async () => {
    let sess = (await sb.auth.getSession()).data.session;
    if(!sess && REC.access_token && REC.refresh_token){
      const r = await sb.auth.setSession({access_token:REC.access_token, refresh_token:REC.refresh_token});
      sess = r.data && r.data.session;
    }
    if(!sess){ document.getElementById("msg").textContent = "This reset link has expired or was already used. Tap Back, then Forgot password to get a new one."; return }
    const {error} = await sb.auth.updateUser({password:document.getElementById("np").value});
    if(error){ document.getElementById("msg").textContent = error.message; return }
    await sb.auth.signOut(); user = null; recovering = false; history.replaceState(null,"",SITE);
    note = "Password updated. Please log in."; start();
  };
}
function start(){
  if(!allBooks.length){ app.innerHTML = "<h1>Books by Nick Koech</h1><p>Coming soon.</p>" + footerHtml(); return }
  if(allBooks.length === 1) book = allBooks[0];
  if(book){ owned = ownedSet.has(book.id); home() } else library();
}

async function registerDevice(){
  mismatch = false;
  const {error} = await sb.rpc("register_device",{p_device_id:did()});
  if(error){
    if((error.message||"").includes("device_mismatch")){ mismatch = true; note = "This account is linked to another phone."; return false }
    await sb.auth.signOut(); user=null; note=human(error); return false;
  }
  await claimRef();
  return true;
}
async function claimRef(){
  try{
    const rc = localStorage.getItem("ref");
    if(!rc) return;
    const r = await sb.rpc("claim_referral",{p_code:rc});
    if(!r.error) localStorage.removeItem("ref");
  }catch(e){}
}
const refCard = () => (user && ownedSet.size) ? '<div class="card"><b>Refer &amp; earn</b><p>Invite friends to read. You earn 30% of every book they buy.</p><button class="alt" id="ref">Get my invite link</button></div>' : "";
async function referView(){
  app.innerHTML = LOADING();
  const back = () => (book ? home() : library());
  const c = await sb.rpc("get_my_referral_code");
  if(c.error || !c.data){ note = "Refer & earn is for readers who have bought a book."; return back() }
  const s = await sb.rpc("my_referral_summary");
  const d = s.data || {};
  const link = SITE + "?ref=" + c.data;
  const wa = "https://wa.me/?text=" + encodeURIComponent("I'm reading books by Nick Koech and thought you'd enjoy them. Start with the free chapters: " + link);
  const kes = n => "KES " + Number(n || 0).toLocaleString();
  const avail = Number(d.available || 0), min = Number(d.min_payout || 200);
  app.innerHTML = `
    <div class="top"><a href="#" id="back">← Back</a><span>${esc(user.email)}</span></div>
    <h1>Refer &amp; earn</h1>
    <p>Share your link. When someone joins through it and buys a book, you earn ${d.rate || 30}% of what they pay, on every book they buy.</p>
    <div class="card"><b>Your invite link</b>
      <input id="lnk" readonly aria-label="Your invite link" value="${esc(link)}">
      <button id="cp">Copy link</button>
      <button class="alt" id="wa">Share on WhatsApp</button>
    </div>
    <div class="card"><b>Your earnings</b>
      <p>Friends who joined: <b>${Number(d.referred || 0)}</b><br>Friends who bought: <b>${Number(d.buyers || 0)}</b><br>Available to withdraw: <b>${kes(avail)}</b><br>Payout requested: <b>${kes(d.requested)}</b><br>Paid to you: <b>${kes(d.paid)}</b></p>
      ${avail >= min ? '<label class="lb" for="ph">Your M-PESA number</label><input id="ph" type="tel" placeholder="e.g. 0712345678" autocomplete="tel" inputmode="tel"><button id="po">Request payout of ' + kes(avail) + '</button>' : '<p>You can request a payout once you have at least ' + kes(min) + ' available.</p>'}
    </div>
    <p class="msg" id="msg">${esc(note)}</p>
    <p><small>Payouts are sent to your M-PESA number after approval. The M-PESA transfer fee (KES 20, or KES 40 above KES 1,500) is deducted from your payout. Commission applies only to people who join through your link before their first purchase, and may be cancelled on refunded sales.</small></p>`;
  note = "";
  const $ = id => document.getElementById(id);
  $("wa").onclick = () => window.open(wa, "_blank", "noopener");
  $("back").onclick = e => { e.preventDefault(); back() };
  $("lnk").onclick = () => $("lnk").select();
  $("cp").onclick = async () => {
    try{ await navigator.clipboard.writeText(link); $("msg").textContent = "Link copied." }
    catch(e){ $("lnk").select(); $("msg").textContent = "Press and hold the link to copy it." }
  };
  if($("po")) $("po").onclick = async () => {
    const ph = $("ph").value.trim();
    if(!ph){ $("msg").textContent = "Enter your M-PESA number."; return }
    $("po").disabled = true;
    const r = await sb.rpc("request_payout",{p_phone:ph});
    if(r.error){
      const m = r.error.message || "";
      $("msg").textContent = m.includes("invalid_phone") ? "That M-PESA number doesn't look right." : m.includes("below_minimum") ? "You need at least " + kes(min) + " available." : "Couldn't send the request. Try again.";
      $("po").disabled = false; return;
    }
    note = "Payout of " + kes(r.data) + " requested. You'll receive it on M-PESA soon.";
    referView();
  };
  window.scrollTo(0,0);
}

async function home(){
  const price = book ? priceInfo().label : "";
  app.innerHTML = `
    <div class="top"><span>${allBooks.length>1?'<a href="#" id="all">← All books</a>':'Nick Koech'}</span><span>${user?esc(user.email)+' · <a href="#" id="out">Log out</a>':''}</span></div>
    ${book&&coverOf(book)?'<img class="cv" src="'+coverOf(book)+'" alt="Cover of '+esc(book.title)+'">':''}
    ${book&&genreOf(book)?'<span class="gn">'+esc(genreOf(book))+'</span>':''}
    <h1>${book?esc(book.title):'My Wishful Thoughts'}</h1>
    <p class="by">By Nick Koech</p>
    <p>${book?esc(book.description||''):''}</p>
    <p class="price">${price}</p>
    <div class="btns">
    ${owned?'':(PAYMENTS_OPEN?'<button id="buy">Buy this book</button>':'<button disabled>Payments opening soon</button>')}
    ${owned?'':'<button class="alt" id="sample">Read free chapters</button>'}
    ${user?'<button class="'+(owned?'':'alt')+'" id="cont">Continue reading'+(Number(localStorage.getItem("last_"+book.id)||1)>1?" (chapter "+Number(localStorage.getItem("last_"+book.id))+")":"")+'</button>':''}
    <button class="alt" id="toc">All chapters</button>
    </div>
    ${owned?'<p class="sub">You own this book. Read it any time on your phone.</p>':'<p class="sub">Read online on your phone \u00b7 Unlocks right after payment \u00b7 Pay securely with M-PESA or card</p>'}
    ${refCard()}
    ${user?'':'<div class="card"><b>Have an account?</b><p>Log in or sign up to buy books and keep reading on your phone.</p><button id="goauth">Log in / Sign up</button></div>'}
    ${mismatchHtml()}
    <p class="msg" id="msg">${esc(note)}</p>${footerHtml()}`;
  note = "";
  const $ = id => document.getElementById(id);
  if($("fp")) $("fp").onclick = e => { e.preventDefault(); forgot() };
  if($("sw")) $("sw").onclick = switchDevice;
  if($("goauth")) $("goauth").onclick = () => authView("in");
  if($("ref")) $("ref").onclick = referView;
  if($("navauth")) $("navauth").onclick = () => authView("in");
  if($("refl")) $("refl").onclick = e => { e.preventDefault(); referView() };
  document.querySelectorAll("a[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); const t = document.getElementById(a.dataset.go); if(t) t.scrollIntoView({behavior:"smooth"}) });
  if($("sample")) $("sample").onclick = async () => { const I = await chInfo(); reader(I.first) };
  if($("buy")) $("buy").onclick = buy;
  $("toc").onclick = toc;
  if($("all")) $("all").onclick = e => { e.preventDefault(); library() };
  if($("cont")) $("cont").onclick = () => reader(Number(localStorage.getItem("last_"+book.id)||1));
  if($("out")) $("out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); user=null; owned=false; ownedSet=new Set(); home() };
  if($("in")) $("in").onclick = async () => {
    const {data,error} = await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(error){ $("msg").textContent = error.message; return }
    user = data.user;
    await registerDevice(); await refreshOwned(); home();
  };
  if($("up")) $("up").onclick = async () => {
    const {data,error} = await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
    if(error){ $("msg").textContent = error.message; return }
    if(data.session){ user = data.user; await registerDevice(); await refreshOwned(); home() }
    else $("msg").textContent = "Check your email to confirm your account, then log in.";
  };
}

async function toc(){
  app.innerHTML = LOADING("Loading chapters…");
  const {data,error} = await sb.rpc("get_chapter_list",{p_book_id:book.id});
  if(error && isNet(error)) return retryView(() => toc(), () => home());
  if(error || !data){ note = "Couldn't load the chapter list."; return home() }
  app.innerHTML = `<div class="top"><a href="#" id="back">← Back</a><span>${data.filter(c => c.chapter_number >= 1 && !isSpecial(c)).length} chapters</span></div><h1>Chapters</h1><div class="toc">`
    + data.map(c => `<button class="alt" data-n="${c.chapter_number}">${isSpecial(c) ? "" : c.chapter_number + ". "}${esc(c.title)}${(!c.is_sample && !owned) ? " 🔒" : ""}</button>`).join("")
    + `</div>`;
  document.getElementById("back").onclick = e => { e.preventDefault(); home() };
  document.querySelectorAll(".toc button").forEach(b => b.onclick = () => reader(Number(b.dataset.n)));
  window.scrollTo(0,0);
}

async function reader(n){
  app.innerHTML = LOADING();
  const {data,error} = await sb.rpc("get_chapter",{p_book_id:book.id,p_chapter_number:n,p_device_id:did()});
  if(error && isNet(error)) return retryView(() => reader(n), () => (book ? home() : library()));
  if(error || !data || !data.length){
    note = human(error);
    if(error && (error.message||"").includes("device_mismatch")) mismatch = true;
    if(n>1 && error && error.message.includes("chapter_not_found")) { return end(n) }
    return home();
  }
  const c = data[0];
  const I = await chInfo(), N = I.main, first = I.first, last = I.last;
  try{localStorage.setItem("last_"+book.id,n)}catch(e){}
  app.innerHTML = `
    <div class="top"><a href="#" id="back">← Book</a><a href="#" id="toc2">Chapters</a><span>${isSpecial(c) ? chLabel(c) : (N ? "Chapter "+c.chapter_number+" of "+N : "Ch. "+c.chapter_number)}</span></div>
    ${N?'<div class="pg"><i style="width:'+Math.min(100,Math.max(0,Math.round(c.chapter_number/N*100)))+'%"></i></div>':''}
    <div class="tools"><button class="alt" id="sm">A−</button><button class="alt" id="lg">A+</button><button class="alt" id="sp">Spacing</button><button class="alt" data-th="light">Light</button><button class="alt" data-th="sepia">Sepia</button><button class="alt" data-th="dark">Dark</button></div>
    <h1>${esc(c.title)}</h1>
    <div class="read" id="txt" style="font-size:${fs}rem;line-height:${lh}">${fmt(c.content)}</div>
    <div class="nav">${n>first?'<button class="alt" id="prev">Previous</button>':''}<button id="next">${last&&n>=last?"Back to book":"Next chapter"}</button></div>`;
  document.getElementById("txt").oncontextmenu = e => e.preventDefault();
  document.getElementById("back").onclick = e => { e.preventDefault(); home() };
  document.getElementById("toc2").onclick = e => { e.preventDefault(); toc() };
  const setFs = d => { fs = Math.min(2, Math.max(.9, fs + d)); try{localStorage.setItem("fs", fs)}catch(e){} document.getElementById("txt").style.fontSize = fs + "rem" };
  document.getElementById("sm").onclick = () => setFs(-.1);
  document.getElementById("lg").onclick = () => setFs(.1);
  if(n>first) document.getElementById("prev").onclick = () => reader(n-1);
  document.getElementById("next").onclick = () => (last && n >= last) ? home() : reader(n+1);
  document.getElementById("sp").onclick = () => { lh = lh >= 2 ? 1.5 : Math.round((lh + .25)*100)/100; try{localStorage.setItem("lh", lh)}catch(e){} document.getElementById("txt").style.lineHeight = lh };
  document.querySelectorAll("button[data-th]").forEach(b => b.onclick = () => setTheme(b.dataset.th));
  window.scrollTo(0,0);
}
function end(n){ note="You've reached the end of what's available."; reader(n-1) }

(async () => {
  const b = await sb.from("books").select("*").eq("published",true).order("created_at");
  if(b.error && !(b.data && b.data.length)){ return retryView(() => location.reload()) }
  allBooks = b.data || [];
  if(allBooks.length === 1) book = allBooks[0];
  const s = await sb.auth.getSession();
  if(s.data.session && !recovering){ user = s.data.session.user; await registerDevice(); await refreshOwned(); await retryPending() }
  if(recovering) return resetView();
  start();
})();
</script>
